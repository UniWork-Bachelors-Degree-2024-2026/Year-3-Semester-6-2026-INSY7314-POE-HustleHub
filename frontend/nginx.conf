# This file is an nginx template. At container start the API_ORIGIN value is filled in
# (see the Dockerfile and docker-compose.yml), so the CSP follows the API address without editing the file.
server {
    # SSL -> HTTPS on port 5173
    listen 5173 ssl;
    server_name localhost;

    # SSL Certificate configuration
    ssl_certificate     /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security -> hide Nginx version information
    server_tokens off;

    # Production Security Headers (MDN Web Docs, 2026; Helmet, 2026)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; font-src https://fonts.gstatic.com; img-src 'self' data:; report-uri ${API_ORIGIN}/api/csp-report; report-to csp-endpoint; script-src 'self'; style-src 'self' https://fonts.googleapis.com; connect-src 'self' ${API_ORIGIN}" always;
    add_header Reporting-Endpoints "csp-endpoint=\"${API_ORIGIN}/api/csp-report\"" always;

    # Serve built static distribution
    root    /usr/share/nginx/html;
    index   index.html;

    # Enable compression to reduce payload size
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Allow client-side routing (React Router) to handle dynamic subpages
    location / {
        try_files $uri $uri/ /index.html;
    }
}
